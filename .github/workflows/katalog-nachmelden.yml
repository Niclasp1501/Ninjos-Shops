# Wegwerf-Werkzeug: den Katalog nachtraeglich ueber eine Version informieren.
#
# Am 17.09.2026 brach der Release-Workflow beim Hochladen von module.zip ab.
# Das Release selbst war danach in Ordnung, aber der Schritt "Foundry Bescheid
# geben" wurde uebersprungen, und ein erneuter Lauf scheitert weiter am schon
# vorhandenen Release. Diese Datei meldet nur den Katalog nach.
name: Katalog nachmelden
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version ohne v, zum Beispiel 14.2609.92
        required: true
jobs:
  melden:
    runs-on: ubuntu-latest
    steps:
      - name: Foundry Bescheid geben
        uses: cs96and/FoundryVTT-release-package@v1
        with:
          package-token: ${{ secrets.PACKAGE_TOKEN }}
          manifest-url: https://github.com/Niclasp1501/Ninjos-Shops/releases/download/v${{ github.event.inputs.version }}/module.json
          notes-url: https://github.com/Niclasp1501/Ninjos-Shops/releases/tag/v${{ github.event.inputs.version }}
